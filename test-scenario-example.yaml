test: # Обязательное поле
  id: "test2 with agents" # Текстовый ID теста
  url: "http://localhost:8000" # Целевой URL
  target_rps: 2000 # Целевой RPS
  workers: 1500 # Количество воркеров
  duration_seconds: 600 # Длительность теста
  method: POST # Метод запросов
  body: '{"name":"test","role":"user"}' # Тело запроса
  monitor: # Поле с параметрами для мониторинга
    enabled: true # Включить экспорт на эндпоинт
agents: # Необязателен, если запуск в соло режиме
  mode: strict # strict - все агенты должны быть досягаемы.
  # Тест не начнётся, если хотя бы к одному агенту нельзя подключиться
  # any - хотя бы агент должен быть досягаем.
  # Тест начнётся, если хотя бы минимум один агент будет доступен для подключения.
  distribution_mode: equal # equal - нагрузка равномерно распределяется по агентам
  # adaptive - нагрузка распределяется пропорционально техническим возможностям агентов. Стоит по умолчанию
  targets: # IP адреса агентов
    - localhost:9001
    - localhost:9002
    - localhost:9003